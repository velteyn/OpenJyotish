name: Publish PyPI

# Publishes the sdist + wheel to PyPI on release tags using Trusted
# Publishing (OIDC) — no API token stored. One-time setup by the owner:
#   1. Create an account at https://pypi.org, log in.
#   2. Register the project name `openjyotish`
#      (https://pypi.org/manage/projects/ → Create).
#   3. In the project: Settings → Publishing → Add a pending publisher:
#      GitHub repository velteyn/OpenJyotish,
#      workflow filename publish-pypi.yml (tag-constrained to v*).
# Afterwards every pushed v* tag publishes automatically.
#
# Idempotent: PyPI filenames are immutable, so re-running this workflow for a
# tag whose version is already published would fail with
# "400 File already exists". The version check below skips the build and
# upload when the version is already on PyPI, so a re-pushed/moved tag does
# not produce a failing run. Prefer tagging a new version over moving a tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether this version is already on PyPI
        id: pypi_check
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "version=${version}"
          if curl -fsS "https://pypi.org/pypi/openjyotish/${version}/json" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "openjyotish ${version} is already published — skipping upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist + wheel
        if: steps.pypi_check.outputs.exists == 'false'
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
