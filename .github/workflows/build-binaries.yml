name: Binaries

# Frozen executables must be built on their own OS: Windows installer and
# Linux bundle. Tags attach everything to the GitHub release; PRs only
# smoke-test the spec on Ubuntu.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packaging/**'
      - 'src/jhora/paths.py'
      - 'src/jhora/__init__.py'
      - 'pyproject.toml'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach binaries to'
        default: 'v1.6.0'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows installer + Linux bundle only (macOS pulled: Gatekeeper
        # friction, unsigned builds not viable there yet).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install app + PyInstaller
        run: pip install . pyinstaller

      - name: Download ephemeris (not in git)
        shell: bash
        run: |
          mkdir -p jhcore/ephe
          # Astrodienst retired their FTP file hosting; the files now live
          # in the aloistr/swisseph mirror (verified bit-identical to 1e-6°).
          base="https://raw.githubusercontent.com/aloistr/swisseph/master/ephe"
          for f in sepl_18.se1 semo_18.se1; do
            [ -f "jhcore/ephe/$f" ] || curl -sSf -o "jhcore/ephe/$f" "$base/$f"
          done
          ls -la jhcore/ephe/

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.release_tag }}"
          else
            RAW="v$(python -c 'import jhora; print(jhora.__version__)')"
          fi
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller bundle
        run: pyinstaller packaging/OpenJyotish.spec --noconfirm

      - name: Smoke test (CLI boots)
        shell: bash
        run: |
          # NOTE: no pipes here — `| head` SIGPIPEs the frozen binary into
          # a false failure.
          ls dist/OpenJyotish/
          if [ "$RUNNER_OS" = "Windows" ]; then timeout 300 ./dist/OpenJyotish/openjyotish.exe --version
          else timeout 300 ./dist/OpenJyotish/openjyotish --version
          fi

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\OpenJyotish.iss

      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          tar -czf "OpenJyotish-${{ steps.ver.outputs.version }}-Linux-x86_64.tar.gz" -C dist OpenJyotish

      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          V="${{ steps.ver.outputs.version }}"
          PKG="pkgroot"
          rm -rf "$PKG"
          mkdir -p "$PKG/opt/openjyotish" "$PKG/usr/bin" \
            "$PKG/usr/share/applications" "$PKG/DEBIAN"
          cp -R dist/OpenJyotish/. "$PKG/opt/openjyotish/"
          ln -s /opt/openjyotish/openjyotish "$PKG/usr/bin/openjyotish"
          ln -s /opt/openjyotish/openjyotish "$PKG/usr/bin/jhora"
          cat > "$PKG/usr/share/applications/openjyotish.desktop" <<EOF
          [Desktop Entry]
          Name=OpenJyotish
          Comment=Free Vedic astrology toolkit
          Exec=/opt/openjyotish/OpenJyotish
          Terminal=false
          Type=Application
          Categories=Education;Science;
          EOF
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: openjyotish
          Version: $V
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: OpenJyotish Contributors <https://github.com/velteyn/OpenJyotish>
          Description: Free open-source Vedic astrology toolkit
           GUI, TUI and CLI for Jyotish charts, dasas, transits and AI readings.
          EOF
          dpkg-deb --build "$PKG" "OpenJyotish-${V}-Linux-amd64.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: |
            dist-installer/*.exe
            OpenJyotish-*.tar.gz
            OpenJyotish-*.deb

  attach-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Pick tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: to-release

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R to-release/
          mapfile -t files < <(find to-release -type f)
          gh release upload "${{ steps.tag.outputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
